name: tmp-sushi24-scrape
on:
  push:
    branches:
      - tmp/sushi24-menu-fetch
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Sushi24 current menus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scrape
          python - <<'PY'
          import re,json,pathlib,urllib.request,html as htmlmod
          headers={'User-Agent':'Mozilla/5.0','Accept':'*/*'}
          pages={
            'vazha':'https://sushi24.ge/en/market/sushi-24-vazha',
            'dighomi':'https://sushi24.ge/en/market/sushi-24-dighomi-city',
            'isani':'https://sushi24.ge/en/market/sushi-24-isani',
            'chikobava':'https://sushi24.ge/en/market/sushi-24-fresco-chicobava',
            'rustavi':'https://sushi24.ge/en/market/sushi24-rustavi',
          }
          def fetch(url,path):
            try:
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=45) as r:
                data=r.read(); meta={'url':url,'status':r.status,'final':r.geturl(),'content_type':r.headers.get('content-type',''),'bytes':len(data),'path':path}
              pathlib.Path(path).write_bytes(data); return meta
            except Exception as e:
              ep=path+'.error.txt'; pathlib.Path(ep).write_text(repr(e),encoding='utf-8'); return {'url':url,'error':repr(e),'path':ep}
          manifest=[]; locations={}
          for slug,url in pages.items():
            pp=f'scrape/{slug}.html'; manifest.append(fetch(url,pp))
            text=pathlib.Path(pp).read_text('utf-8','replace') if pathlib.Path(pp).exists() else ''
            m=re.search(r'id="menu-app"[^>]*data-restaurant=["\'](.*?)["\']',text,re.I|re.S)
            rid=None
            if m:
              raw=htmlmod.unescape(m.group(1)); mm=re.search(r'["\']id["\']\s*:\s*(\d+)',raw); rid=int(mm.group(1)) if mm else None
            if not rid:
              mm=re.search(r'data-restaurant=.*?&quot;id&quot;:\s*(\d+)',text,re.I|re.S); rid=int(mm.group(1)) if mm else None
            locations[slug]={'page':url,'restaurant_id':rid}
            if rid:
              api=f'https://sushi24.ge/api/v2/menu/{rid}/en/bundle'; ap=f'scrape/{slug}-menu.json'; manifest.append(fetch(api,ap)); locations[slug]['menu_api']=api
          pathlib.Path('scrape/locations.json').write_text(json.dumps(locations,ensure_ascii=False,indent=2),encoding='utf-8')
          pathlib.Path('scrape/manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sushi24-current-menus
          path: scrape
          retention-days: 1
