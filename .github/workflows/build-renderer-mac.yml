name: Build Renderer macOS DMG

on:
  workflow_dispatch:
  push:
    branches:
      - feature/sushiwoki-site-banners
    paths:
      - 'local-renderer/**'
      - '.github/workflows/build-renderer-mac.yml'

jobs:
  build-mac-dmg:
    name: Build macOS DMG
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    defaults:
      run:
        working-directory: local-renderer
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build DMG
        run: npm run dist:mac

      - name: List build output
        run: ls -la dist

      - name: Upload DMG artifacts
        uses: actions/upload-artifact@v4
        with:
          name: print-menu-renderer-macos-dmg
          path: local-renderer/dist/*.dmg
          if-no-files-found: error
          retention-days: 14
