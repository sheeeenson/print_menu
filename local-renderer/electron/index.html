<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Print Menu Renderer</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #171922;
      color: #f7f4ee;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top left, rgba(140,61,255,0.20), transparent 38%), #171922;
      color: #f7f4ee;
    }
    main {
      display: grid;
      gap: 18px;
      padding: 28px;
    }
    header {
      display: grid;
      gap: 7px;
    }
    .kicker {
      margin: 0;
      color: #b7b0a8;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: 32px;
      line-height: 1;
      letter-spacing: -0.04em;
    }
    .card {
      display: grid;
      gap: 14px;
      padding: 18px;
      border: 1px solid rgba(255,255,255,0.11);
      border-radius: 22px;
      background: rgba(28,31,41,0.86);
      box-shadow: 0 18px 44px rgba(0,0,0,0.22);
    }
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      border-radius: 999px;
      padding: 8px 12px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.11);
      font-weight: 900;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: #ff7777;
      box-shadow: 0 0 0 4px rgba(255,119,119,0.13);
    }
    .status.ok .dot {
      background: #60d394;
      box-shadow: 0 0 0 4px rgba(96,211,148,0.16);
    }
    .url {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #cfc7bd;
      font-weight: 750;
    }
    .actions {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }
    button {
      min-height: 44px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.06);
      color: #f7f4ee;
      font: inherit;
      font-size: 14px;
      font-weight: 850;
      cursor: pointer;
    }
    button:hover { border-color: rgba(190,160,255,0.55); background: rgba(255,255,255,0.10); }
    dl {
      display: grid;
      grid-template-columns: minmax(150px, 0.45fr) minmax(0, 1fr);
      gap: 9px 14px;
      margin: 0;
      font-size: 13px;
    }
    dt { color: #b7b0a8; font-weight: 800; }
    dd { margin: 0; min-width: 0; overflow-wrap: anywhere; font-weight: 750; }
    pre {
      margin: 0;
      max-height: 150px;
      overflow: auto;
      border-radius: 14px;
      padding: 12px;
      background: rgba(0,0,0,0.22);
      color: #d8d1c7;
      font-size: 12px;
      line-height: 1.45;
    }
    .muted { color: #b7b0a8; margin: 0; line-height: 1.45; }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="kicker">Local renderer</p>
      <h1>Print Menu Renderer</h1>
      <p class="muted">Keep this app open while exporting MP4/WebM from Print Menu.</p>
    </header>

    <section class="card">
      <div class="status-row">
        <div id="status" class="status"><span class="dot"></span><span>Checking...</span></div>
        <div id="url" class="url">http://localhost:3020</div>
      </div>
      <div class="actions">
        <button id="refresh">Test health</button>
        <button id="open">Open renderer</button>
        <button id="health">Open /health</button>
      </div>
    </section>

    <section class="card">
      <dl>
        <dt>stableCssTimeline</dt><dd id="stableCssTimeline">—</dd>
        <dt>gifConversion</dt><dd id="gifConversion">—</dd>
        <dt>gifConversionPipe</dt><dd id="gifConversionPipe">—</dd>
        <dt>ffmpeg</dt><dd id="ffmpegPath">—</dd>
        <dt>Playwright browsers</dt><dd id="playwrightBrowsersPath">—</dd>
      </dl>
      <pre id="raw">Waiting for health check...</pre>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    async function refreshStatus() {
      const statusNode = $('status');
      const statusText = statusNode.querySelector('span:last-child');
      statusText.textContent = 'Checking...';
      statusNode.classList.remove('ok');

      const status = await window.printMenuRenderer.getStatus();
      const body = status.health?.body || {};
      const ok = Boolean(status.health?.ok);

      $('url').textContent = status.url || 'http://localhost:3020';
      statusText.textContent = ok ? 'Renderer running' : 'Renderer unavailable';
      statusNode.classList.toggle('ok', ok);

      $('stableCssTimeline').textContent = String(Boolean(body.stableCssTimeline));
      $('gifConversion').textContent = String(Boolean(body.gifConversion));
      $('gifConversionPipe').textContent = String(Boolean(body.gifConversionPipe));
      $('ffmpegPath').textContent = status.ffmpegPath || 'system ffmpeg';
      $('playwrightBrowsersPath').textContent = status.playwrightBrowsersPath || 'default Playwright cache';
      $('raw').textContent = JSON.stringify(status, null, 2);
    }

    $('refresh').addEventListener('click', refreshStatus);
    $('open').addEventListener('click', () => window.printMenuRenderer.openUrl());
    $('health').addEventListener('click', () => window.printMenuRenderer.openHealth());

    refreshStatus();
    setInterval(refreshStatus, 5000);
  </script>
</body>
</html>
